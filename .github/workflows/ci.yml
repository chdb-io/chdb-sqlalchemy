name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- L1+L3
  unit-and-contract:
    name: Unit + Contract (Py ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
        sqlalchemy: ["2.0.*", "2.1.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy${{ matrix.sqlalchemy }}"
          pip install -e ".[dev,langchain]"
      - name: Lint (ruff)
        run: ruff check chdb_sqlalchemy tests
      - name: Type check (mypy)
        run: mypy chdb_sqlalchemy
      - name: Unit + Contract tests
        # L1 type parser + connector + L3 LangChain contract.
        # Excludes integration/differential/perf/fuzz (covered in nightly).
        run: |
          pytest -ra -m "not integration and not differential and not perf and not fuzz"

  # ---------------------------------------------------------------- L7 fuzz
  fuzz:
    name: Fuzz parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fuzz the type parser
        run: pytest -ra -m fuzz tests/fuzz

  # ---------------------------------------------------------------- L4 integration (nightly)
  integration:
    name: LangChain end-to-end (cassettes)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[ci-integration]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langchain,test-integration]"
      - name: Replay LLM cassettes
        run: pytest -ra -m integration tests/integration

  # ---------------------------------------------------------------- L5 differential (nightly)
  differential:
    name: chDB vs ClickHouse server
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3.9.8-lts
        ports: ["8123:8123", "9000:9000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test-differential]"
      - run: pytest -ra -m differential tests/differential
