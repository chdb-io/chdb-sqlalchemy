name: Publish

# Tag-triggered automatic release flow:
#
#   git tag v0.2.1 && git push upstream v0.2.1
#     ↓
#   workflow runs: build → twine check → twine upload → gh release upload
#     ↓
#   pip install chdb-sqlalchemy==0.2.1 works globally
#
# Modeled on chdb-io/chdb's mainline wheel-publish workflow, simplified
# because chdb-sqlalchemy is a pure-Python universal wheel (no per-OS /
# per-arch matrix).
#
# One-time external setup required before this workflow will succeed:
#
# 1. Create PyPI API token scoped to the chdb-sqlalchemy project at
#    https://pypi.org/manage/account/token/
# 2. Add it as repo secret PYPI_API_TOKEN at
#    https://github.com/chdb-io/chdb-sqlalchemy/settings/secrets/actions/new
# 3. (Optional but recommended) Create environment "pypi" at
#    https://github.com/chdb-io/chdb-sqlalchemy/settings/environments
#    and attach a protection rule (required reviewer) — gives one
#    manual approve-click between tag push and PyPI upload.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g., v0.2.1) — must already exist'
        required: true

permissions:
  contents: write   # for GitHub Release creation + asset upload

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to PyPI + GitHub Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chdb-sqlalchemy/
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Resolve tag → version + verify pyproject.toml match
        id: ver
        run: |
          # Determine the tag we're publishing.
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"

          # Cross-check pyproject.toml says the same version. Catches
          # accidental "tag v0.2.1 but forgot to bump pyproject" mistakes
          # before they reach PyPI (where versions are immutable).
          PYPROJECT_VERSION=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.+)"/\1/')
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version '$VERSION' does not match pyproject.toml version '$PYPROJECT_VERSION'. Refusing to publish."
            exit 1
          fi
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "Tag '$TAG' (version $VERSION) matches pyproject.toml. Proceeding."

      - name: Build wheel + sdist
        run: uv build

      - name: Validate distributions
        run: uvx twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uvx twine upload dist/*

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # Create the release if it doesn't exist; otherwise reuse it.
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Automated release — see [CHANGELOG.md](./CHANGELOG.md) for the v${{ steps.ver.outputs.version }} entry. Published to https://pypi.org/project/chdb-sqlalchemy/${{ steps.ver.outputs.version }}/."
          fi
          gh release upload "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --clobber
