# Configuration for the SQLAlchemy testing pytest plugin (L2).
#
# Other project metadata lives in pyproject.toml. This file exists *only*
# because sqlalchemy.testing.plugin reads from setup.cfg's [sqla_testing]
# section, not from pyproject.toml — see SA dialect-testing docs.

[sqla_testing]
requirement_cls = chdb_sqlalchemy.requirements:Requirements
profile_file = tests/.sa-profiles.txt

[db]
default = chdb:///:memory:
chdb = chdb:///:memory:
